# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true
      - run: flutter pub get
      # Fatal on errors only -- see android-build.yml for why.
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test
      - run: flutter build web --release --base-href /
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HALABESSA_CARD_GAME1 }}
          channelId: live
          projectId: halabessa-card-game1
      # action-hosting-deploy above only ever touches Hosting. Firestore/
      # Storage/Database rules (firestore.rules, storage.rules,
      # database.rules.json) sat in the repo unenforced until now -- nothing
      # deployed them. Reuses the same service account secret; the CLI picks
      # it up as Application Default Credentials via GOOGLE_APPLICATION_CREDENTIALS.
      #
      # Deployed as three independent steps rather than one combined
      # `--only firestore:rules,storage:rules,database` command: the CLI
      # processes targets in its own order and aborts the whole command on
      # the first failure, so one target failing silently prevented the
      # other two from being attempted at all.
      - name: Deploy Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_HALABESSA_CARD_GAME1 }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase-tools deploy --only firestore:rules --project halabessa-card-game1 --non-interactive
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Deploy Storage rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_HALABESSA_CARD_GAME1 }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase-tools deploy --only storage:rules --project halabessa-card-game1 --non-interactive
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

      # continue-on-error: the service account used here was originally
      # provisioned just for Hosting deploys (via `firebase init
      # hosting:github`) and this failed with "Failed to get instance
      # details for instance: halabessa-card-game1-default-rtdb" -- almost
      # certainly missing the Firebase Realtime Database IAM role, which
      # only a project owner can grant in Google Cloud Console > IAM & Admin.
      # Not blocking Firestore/Storage rules (which don't need that role) on
      # a permission gap I can't grant myself.
      - name: Deploy Realtime Database rules
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_HALABESSA_CARD_GAME1 }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase-tools deploy --only database --project halabessa-card-game1 --non-interactive
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
