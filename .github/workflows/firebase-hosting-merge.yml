# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true
      - run: flutter pub get
      # Fatal on errors only -- see android-build.yml for why.
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test
      - name: Install Functions dependencies
        run: npm ci --prefix functions
      # Deploy the server-side enforcement and its rules before the client.
      # Do not publish a release when any of these steps fails.
      - name: Deploy Firebase backend and rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_HALABESSA_CARD_GAME1 }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase-tools deploy --only functions,firestore:rules,storage:rules,database --project halabessa-card-game1 --non-interactive
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
      - name: Install ChromeDriver
        run: |
          sudo apt-get update && sudo apt-get install -y chromium-chromedriver
          chromedriver --port=4444 &
      - name: Run Integration Tests
        run: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart -d web-server --release
      - run: flutter build web --release --base-href /
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HALABESSA_CARD_GAME1 }}
          channelId: live
          projectId: halabessa-card-game1
