# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true
      - run: flutter pub get
      # Fatal on errors only -- see android-build.yml for why.
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test
      - name: Run Integration Tests
        run: flutter test integration_test/app_test.dart -d chrome --web-renderer canvaskit
      - run: flutter build web --release --base-href /
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HALABESSA_CARD_GAME1 }}
          channelId: live
          projectId: halabessa-card-game1
      # action-hosting-deploy above only ever touches Hosting. Firestore/
      # Storage/Database rules (firestore.rules, storage.rules,
      # database.rules.json) sat in the repo unenforced until now -- nothing
      # deployed them. Reuses the same service account secret; the CLI picks
      # it up as Application Default Credentials via GOOGLE_APPLICATION_CREDENTIALS.
      #
      # Three independent steps rather than one combined
      # `--only firestore:rules,storage:rules,database` command, each with
      # continue-on-error + if: always() so one target failing (e.g. a
      # missing IAM role on the deploy service account for that specific
      # target) can never prevent the others from being attempted. Without
      # both of these, GitHub Actions' default "stop the job on the first
      # failing step" would have the exact same silent-skip problem the
      # split was meant to fix.
      - name: Deploy Firestore rules
        if: always()
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_HALABESSA_CARD_GAME1 }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase-tools deploy --only firestore:rules --project halabessa-card-game1 --non-interactive
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Deploy Storage rules
        if: always()
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_HALABESSA_CARD_GAME1 }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase-tools deploy --only storage:rules --project halabessa-card-game1 --non-interactive
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Deploy Realtime Database rules
        if: always()
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_HALABESSA_CARD_GAME1 }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase-tools deploy --only database --project halabessa-card-game1 --non-interactive
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
