# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: firebase-hosting-main
  cancel-in-progress: true
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Typecheck deletion adapters
        run: >-
          npm exec --yes --package=typescript@5.9.3 -- tsc --noEmit
          --allowImportingTsExtensions --target es2022 --module esnext
          --moduleResolution bundler --lib es2023,dom --skipLibCheck
          supabase/functions/halabessa-api/deletion_firebase_data.ts
          supabase/functions/halabessa-api/deletion_avatars.ts
          supabase/functions/halabessa-api/deletion_realtime_data.ts
          supabase/functions/halabessa-api/deletion_rooms.ts
          supabase/functions/halabessa-api/deletion_job_store.ts
          supabase/functions/halabessa-api/avatar_upload_policy.ts
      - name: Test authoritative match engines and database lifecycle
        run: >-
          node --test functions/test/match_engine.test.js
          functions/test/edge_bot_strategy.test.ts functions/test/edge_match_engine.test.ts
          functions/test/edge_match_lifecycle.test.ts functions/test/edge_match_commands.test.ts
          functions/test/edge_room_seating.test.ts functions/test/edge_room_summary.test.ts
          functions/test/edge_match_rewards.test.ts functions/test/edge_turn_policy.test.ts
          functions/test/edge_match_delivery.test.ts functions/test/edge_database.test.ts
          functions/test/edge_public_profiles.test.ts functions/test/edge_account_deletion.test.ts
          functions/test/edge_firebase_identity.test.ts
          functions/test/edge_deletion_job_store.test.ts
          functions/test/edge_deletion_access.test.ts
          functions/test/edge_deletion_room_state.test.ts
          functions/test/edge_deletion_rooms.test.ts
          functions/test/edge_deletion_firebase_data.test.ts
          functions/test/edge_deletion_avatars.test.ts
          functions/test/edge_avatar_upload_policy.test.ts
          functions/test/edge_deletion_realtime_data.test.ts
          functions/test/unity_web_startup.test.js functions/test/web_build_versioning.test.mjs
          functions/test/release_pages.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Test profile and private-match permissions in isolated emulators
        working-directory: rules-tests
        run: |
          npm ci --no-audit --no-fund
          npm test
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true
      - run: flutter pub get
      # Fatal on errors only -- see android-build.yml for why.
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test
      # Backend mutations run in Supabase Edge Functions because Firebase
      # Functions requires the Blaze plan. Firebase remains responsible for
      # Hosting, Authentication, and the existing database rules.
      - name: Deploy Firebase indexes before dependent rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json
        run: |
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_HALABESSA_CARD_GAME1 }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase-tools@15.32.1 deploy --only firestore:indexes --project halabessa-card-game1 --non-interactive
          npx firebase-tools@15.32.1 deploy --only firestore:rules,database --project halabessa-card-game1 --non-interactive
      - run: flutter build web --release --base-href / --pwa-strategy=none
      - name: Fingerprint Flutter entrypoints
        run: node scripts/version-web-build.mjs
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HALABESSA_CARD_GAME1 }}
          channelId: live
          projectId: halabessa-card-game1
