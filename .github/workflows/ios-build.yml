name: Flutter iOS Build

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ios-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        # App Store Connect requires Xcode 26 or later. Keep this build on the
        # store toolchain so a green run is meaningful for release readiness.
        runs-on: macos-26
        timeout-minutes: 45

        steps:
            # The checked-in Unity export contains static libraries tracked by
            # Git LFS. Without this, Xcode receives tiny pointer text files and
            # reports every .a as an "unknown file type".
            - uses: actions/checkout@v4

            - name: Verify Unity static libraries
              run: |
                  git lfs pull --include="ios/UnityLibrary/**" --exclude=""
                  test "$(head -c 7 ios/UnityLibrary/Libraries/libiPhone-lib.a)" = '!<arch>'
                  test "$(head -c 7 ios/UnityLibrary/Libraries/baselib.a)" = '!<arch>'

            - name: Verify App Store toolchain
              run: |
                  xcodebuild -version
                  xcrun --sdk iphoneos --show-sdk-version
                  xcodebuild -version | grep -Eq '^Xcode (26|27)\.'

            - name: Set up Flutter
              uses: subosito/flutter-action@v2
              with:
                  flutter-version: "3.47.2"
                  cache: true

            - name: Install dependencies
              run: flutter pub get

            - name: Verify dependency lockfile is committed
              # Mobile release builds must be reproducible. This also exposes
              # coordinated FlutterFire upgrades that were resolved in CI but
              # omitted from the application lockfile.
              run: git diff --exit-code -- pubspec.lock

            - name: Install CocoaPods dependencies
              run: |
                  cd ios
                  pod install

            - name: Verify iOS dependency graph
              run: |
                  privacy_settings="$(xcodebuild \
                    -project ios/Pods/Pods.xcodeproj \
                    -target flutter_unity_widget-flutter_unity_widget_privacy \
                    -configuration Release \
                    -sdk iphoneos \
                    -showBuildSettings)"
                  if printf '%s\n' "$privacy_settings" | grep -E '^ *OTHER_LDFLAGS =.*UnityFramework'; then
                    echo 'UnityFramework leaked into the resource-only privacy target.' >&2
                    exit 1
                  fi
                  if grep -q 'firebase-ios-sdk' ios/UnityLibrary/Unity-iPhone.xcodeproj/project.pbxproj; then
                    echo 'Unity still contains a duplicate Firebase Swift package.' >&2
                    exit 1
                  fi
                  grep -q 'FirebaseCore (12.10.0)' ios/Podfile.lock
                  for flutterfire_pod in \
                    'firebase_core (4.6.0)' \
                    'firebase_auth (6.3.0)' \
                    'firebase_database (12.2.0)' \
                    'cloud_firestore (6.2.0)'; do
                    if ! grep -Fqx -- "  - ${flutterfire_pod}:" ios/Podfile.lock; then
                      echo "FlutterFire pod ${flutterfire_pod} is missing from CocoaPods; SwiftPM/CocoaPods integration has split again." >&2
                      exit 1
                    fi
                  done
                  for package_version in \
                    'firebase_core 4.6.0' \
                    'firebase_auth 6.3.0' \
                    'firebase_database 12.2.0' \
                    'cloud_firestore 6.2.0'; do
                    package="${package_version% *}"
                    version="${package_version#* }"
                    if ! grep -A 7 "^  ${package}:" pubspec.lock | grep -q "version: \"${version}\""; then
                      echo "Resolved ${package} does not match FlutterFire BoM version ${version}." >&2
                      exit 1
                    fi
                  done
                  unity_settings="$(xcodebuild \
                    -project ios/UnityLibrary/Unity-iPhone.xcodeproj \
                    -target UnityFramework \
                    -configuration Release \
                    -sdk iphoneos \
                    -showBuildSettings)"
                  for framework in FirebaseAnalytics FirebaseAuth FirebaseCore FirebaseDatabase; do
                    if ! printf '%s\n' "$unity_settings" | grep -E "^ *OTHER_LDFLAGS =.*${framework}"; then
                      echo "UnityFramework is missing CocoaPods linkage for ${framework}." >&2
                      exit 1
                    fi
                  done

            - name: Analyze
              # Fatal on errors only -- see android-build.yml for why.
              run: flutter analyze --no-fatal-warnings --no-fatal-infos

            - name: Test
              run: flutter test

            - name: Build iOS (No codesign)
              # Keep verbose output while validating the Unity export under
              # Xcode 26; Flutter's summary can hide the failing Xcode target.
              run: flutter build ios --release --no-codesign --verbose
              # Note: Codesigning requires certificates/profiles in GitHub Secrets.
              # This step verifies the code compiles for iOS in a CI environment.

            - name: Upload iOS Build
              uses: actions/upload-artifact@v4
              with:
                  name: ios-build
                  path: build/ios/iphoneos/Runner.app
                  retention-days: 7
