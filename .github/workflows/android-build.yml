name: Flutter Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android validation
    # Was windows-latest -- roughly twice the Actions minute cost of Ubuntu
    # for the same APK, and nothing about this build is Windows-specific.
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Prepare Android runner disk space
        # The previous runner exhausted its disk during Gradle transforms.
        # Remove only unused, preinstalled SDKs on this disposable Linux runner;
        # preserve Android, Java, Flutter and the rest of the tool cache.
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          for target in /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL; do
            if [[ -e "$target" ]]; then
              [[ ! -L "$target" && "$(realpath -- "$target")" == "$target" ]] || exit 1
              sudo rm -rf -- "$target"
            fi
          done
          df -h /
          available_kib=$(df -Pk / | awk 'NR == 2 {print $4}')
          if (( available_kib < 12 * 1024 * 1024 )); then
            echo "::error::Less than 12 GiB free before the Android build tool installation."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test card privacy, native entrypoints and runner preparation
        run: node --test functions/test/card_reveal.test.ts functions/test/native_entrypoints.test.mjs functions/test/android_ci_disk.test.mjs

      - name: Verify Unity native libraries
        run: |
          git lfs pull --include="androidBuild/unityExport/unityLibrary/src/main/jniLibs/**" --exclude=""
          test "$(head -c 4 androidBuild/unityExport/unityLibrary/src/main/jniLibs/arm64-v8a/libil2cpp.so | xxd -p)" = '7f454c46'
          test "$(head -c 4 androidBuild/unityExport/unityLibrary/src/main/jniLibs/arm64-v8a/libunity.so | xxd -p)" = '7f454c46'
          test "$(head -c 4 androidBuild/unityExport/unityLibrary/src/main/jniLibs/arm64-v8a/libmain.so | xxd -p)" = '7f454c46'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Set up Android SDK, NDK, and CMake
        # v3 attempts to install Google's retired `tools` SDK package and
        # fails before the Flutter build starts. v4 uses command-line tools.
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 16 and Unity export build tools
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Fatal on errors only: the repo carries ~220 pre-existing info/warning-
        # level lints (mostly the withOpacity -> withValues deprecation) that
        # predate this gate and aren't part of what's being fixed here -- see
        # HAL-18 for that cleanup. This still catches real breakage (e.g. an
        # undefined-name compile error), which is what a CI gate is actually for.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Test opt-in card and deck presentation
        run: >-
          flutter test --dart-define=HALABESSA_CARD_INTERACTIONS=true
          --dart-define=HALABESSA_DECK_SPICES=true
          test/card_gesture_intents_test.dart test/card_reveal_two_client_test.dart
          test/deck_action_presentation_test.dart test/unity_visual_handoff_test.dart

      - name: Prepare optional persistent Android signing identity
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.HALABESSA_UPLOAD_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/halabessa-upload.jks"
            echo "HALABESSA_UPLOAD_KEYSTORE=$RUNNER_TEMP/halabessa-upload.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK (Release code, CI signing)
        # A previous run failed while Gradle updated a shared runner cache's
        # last-build.bin. Keep Gradle's mutable state isolated per job and
        # disable the daemon/file watcher, neither of which helps a one-shot
        # CI release build.
        env:
          HALABESSA_UPLOAD_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.HALABESSA_UPLOAD_STORE_PASSWORD || '' }}
          HALABESSA_UPLOAD_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.HALABESSA_UPLOAD_KEY_ALIAS || '' }}
          HALABESSA_UPLOAD_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.HALABESSA_UPLOAD_KEY_PASSWORD || '' }}
          GRADLE_USER_HOME: ${{ runner.temp }}/halabessa-gradle
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false
        run: flutter build apk --release --android-skip-build-dependency-validation
        # Without all four private upload-key settings this is a debug-signed
        # release-code check, not a Play submission build.

      - name: Verify Play target and 16 KB native library packaging
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -v -c -P 16 4 build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/app/outputs/flutter-apk/app-release.apk | grep -Fq "targetSdkVersion:'36'"

      - name: Report actual APK signing certificate for Google sign-in setup
        # Certificate fingerprints are public identifiers, not keystore secrets.
        # Register the APK's SHA-1 in Firebase; a runner-generated debug key is
        # not a stable identity for Google sign-in across future CI builds.
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk'

      - name: Build App Bundle (CI signing)
        # Exercise the Play package format. Submission still needs the owner's
        # upload key and Play App Signing configuration.
        env:
          HALABESSA_UPLOAD_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.HALABESSA_UPLOAD_STORE_PASSWORD || '' }}
          HALABESSA_UPLOAD_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.HALABESSA_UPLOAD_KEY_ALIAS || '' }}
          HALABESSA_UPLOAD_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.HALABESSA_UPLOAD_KEY_PASSWORD || '' }}
          GRADLE_USER_HOME: ${{ runner.temp }}/halabessa-gradle
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
