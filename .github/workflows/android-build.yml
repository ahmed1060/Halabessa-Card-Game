name: Flutter Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    # Was windows-latest -- roughly twice the Actions minute cost of Ubuntu
    # for the same APK, and nothing about this build is Windows-specific.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Set up Android SDK, NDK, and CMake
        uses: android-actions/setup-android@v3

      - name: Install Unity export build tools
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Fatal on errors only: the repo carries ~220 pre-existing info/warning-
        # level lints (mostly the withOpacity -> withValues deprecation) that
        # predate this gate and aren't part of what's being fixed here -- see
        # HAL-18 for that cleanup. This still catches real breakage (e.g. an
        # undefined-name compile error), which is what a CI gate is actually for.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation
        # We use --release for the final production deliverable.

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
