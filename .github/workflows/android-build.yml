name: Flutter Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Was windows-latest -- roughly twice the Actions minute cost of Ubuntu
    # for the same APK, and nothing about this build is Windows-specific.
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Verify Unity native libraries
        run: |
          git lfs pull --include="androidBuild/unityExport/unityLibrary/src/main/jniLibs/**" --exclude=""
          test "$(head -c 4 androidBuild/unityExport/unityLibrary/src/main/jniLibs/arm64-v8a/libil2cpp.so | xxd -p)" = '7f454c46'
          test "$(head -c 4 androidBuild/unityExport/unityLibrary/src/main/jniLibs/arm64-v8a/libunity.so | xxd -p)" = '7f454c46'
          test "$(head -c 4 androidBuild/unityExport/unityLibrary/src/main/jniLibs/arm64-v8a/libmain.so | xxd -p)" = '7f454c46'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Set up Android SDK, NDK, and CMake
        # v3 attempts to install Google's retired `tools` SDK package and
        # fails before the Flutter build starts. v4 uses command-line tools.
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 16 and Unity export build tools
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Fatal on errors only: the repo carries ~220 pre-existing info/warning-
        # level lints (mostly the withOpacity -> withValues deprecation) that
        # predate this gate and aren't part of what's being fixed here -- see
        # HAL-18 for that cleanup. This still catches real breakage (e.g. an
        # undefined-name compile error), which is what a CI gate is actually for.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build APK (Release code, CI signing)
        # A previous run failed while Gradle updated a shared runner cache's
        # last-build.bin. Keep Gradle's mutable state isolated per job and
        # disable the daemon/file watcher, neither of which helps a one-shot
        # CI release build.
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/halabessa-gradle
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false
        run: flutter build apk --release --android-skip-build-dependency-validation
        # This validates release-mode code. The current Gradle configuration
        # signs with the debug key, so this APK is not a Play submission build.

      - name: Verify Play target and 16 KB native library packaging
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -v -c -P 16 4 build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/app/outputs/flutter-apk/app-release.apk | grep -Fq "targetSdkVersion:'36'"

      - name: Build App Bundle (CI signing)
        # Exercise the package format Google Play accepts. No upload key is
        # configured in this workflow, so this output is only a build check.
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/halabessa-gradle
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
