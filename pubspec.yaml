name: halabessa
description: "Halabessa - The ultimate Egyptian card game experience."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  # Flutter 3.47 ships with a modern Dart SDK. Keep the lower bound aligned
  # with the dependency graph rather than resolving packages that cannot build.
  sdk: ">=3.10.0 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.6
  playing_cards: ^0.4.1+11
  flutter_riverpod: ^2.6.1
  # Keep the FlutterFire packages on one published BoM generation. These
  # versions are the first coordinated family after Firebase Apple SDK 12
  # removed FIROptions.deepLinkURLScheme; the older 3.x core plugin still
  # compiled against that removed property. Exact pins prevent a later
  # FlutterFire release from silently requiring a native SDK newer than the
  # Unity export's Firebase 12.10.0 ABI.
  firebase_core: 4.6.0
  firebase_auth: 6.3.0
  firebase_database: 12.2.0
  easy_localization: ^3.0.8
  # 6.3.0 raises the Android implementation to the v2-only embedding. Older
  # 6.1.x implementations reference PluginRegistry.Registrar, removed by the
  # Flutter 3.47 toolchain used in CI.
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^7.0.1
  flutter_facebook_auth: ^7.1.0
  shared_preferences: ^2.2.3
  audioplayers: ^6.1.0
  cloud_firestore: 6.2.0
  image_picker: ^1.1.2
  # 0.8.12+1 still references the Android v1 embedding removed by Flutter
  # 3.47. Keep the first compatible implementation explicit until the
  # app-facing package advances the transitive floor.
  image_picker_android: ^0.8.12+2
  # 2.2.4 still references PluginRegistry.Registrar. 2.2.5 is the first
  # path_provider Android implementation without the removed v1 embedding.
  path_provider_android: ^2.2.5
  # Same Flutter 3.47 compatibility floor for the preferences implementation.
  shared_preferences_android: ^2.2.3
  # Flutter 3.47 removed the Android v1 embedding APIs. Older transitive
  # lifecycle releases still reference PluginRegistry.Registrar.
  flutter_plugin_android_lifecycle: 2.0.35
  quiver: ^3.2.1
  file_picker: ^8.0.0+1
  http: 1.2.2
  # 5.5.0 references the removed UnmodifiableUint8ListView API. Pin the first
  # compatible release until upstream plugin constraints naturally resolve it.
  win32: 5.5.1
  confetti: ^0.8.0
  flutter_unity_widget:
    git:
      url: https://github.com/juicycleff/flutter-unity-view-widget.git
      ref: experimental/unity_6000

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^3.0.0

  # The following section is specific to Flutter packages.
flutter:
  # Flutter 3.44+ prefers Swift Package Manager for compatible plugins. The
  # checked-in Unity iOS export still consumes Firebase through CocoaPods, so
  # keep every Firebase client on one native dependency graph until that Unity
  # export is regenerated. Mixing SPM FlutterFire with CocoaPods Unity Firebase
  # resolves different SDK versions and produces duplicate/incompatible APIs.
  config:
    enable-swift-package-manager: false

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/translations/
    - assets/images/logo.png
    - assets/images/cards/premium/
    - assets/images/cards/neon/
    - assets/images/cards/royal/
    - assets/images/tables/
    - assets/images/items/
    - assets/images/avatars/
    - assets/images/gaming/
    # Unity WebGL loads from web/Build/ (see web/index.html), not a Flutter
    # asset directory -- assets/unity/ was a stale export target from the
    # old Halabessa/Export/WebGL (Brotli) command (see BuildScripts.cs).

  # Fonts are provided via Google Fonts CDN in web/index.html to ensure Safari compatibility and avoid duplication errors.
