plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Keep upload credentials outside Git. CI intentionally builds with a debug
// key until a Play release is explicitly prepared with all four variables.
def uploadSigning = [
    storePath: System.getenv('HALABESSA_UPLOAD_KEYSTORE'),
    storePassword: System.getenv('HALABESSA_UPLOAD_STORE_PASSWORD'),
    keyAlias: System.getenv('HALABESSA_UPLOAD_KEY_ALIAS'),
    keyPassword: System.getenv('HALABESSA_UPLOAD_KEY_PASSWORD')
]
def hasAnyUploadSigning = uploadSigning.values().any { it }
def hasCompleteUploadSigning = uploadSigning.values().every { it }
if (hasAnyUploadSigning && !hasCompleteUploadSigning) {
    throw new GradleException('All HALABESSA_UPLOAD_* signing variables must be set together.')
}
if (hasCompleteUploadSigning && !file(uploadSigning.storePath).isFile()) {
    throw new GradleException('HALABESSA_UPLOAD_KEYSTORE must point to an existing keystore file.')
}
if (System.getenv('HALABESSA_REQUIRE_UPLOAD_SIGNING') == 'true' && !hasCompleteUploadSigning) {
    throw new GradleException('A Play release requires an upload keystore; CI debug signing is not allowed.')
}

android {
    namespace "com.halabessa.game"
    compileSdk 36
    ndkVersion "28.2.13676358"
    // ndkPath pointed at a local Unity Editor install (someone's Windows
    // machine) -- unityLibrary/build.gradle already has this same line
    // commented out for the same reason. ndkVersion alone is enough: AGP
    // auto-provisions that NDK version via the SDK manager if it isn't
    // already present.
    // ndkPath "C:/Program Files/Unity/Hub/Editor/6000.0.69f1/Editor/Data/PlaybackEngines/AndroidPlayer/NDK"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.halabessa.game"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 23
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        if (hasCompleteUploadSigning) {
            upload {
                storeFile file(uploadSigning.storePath)
                storePassword uploadSigning.storePassword
                keyAlias uploadSigning.keyAlias
                keyPassword uploadSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasCompleteUploadSigning ? signingConfigs.upload : signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation project(':unityLibrary')
}
