allprojects {
    repositories {
        google()
        mavenCentral()
        flatDir {
            dirs "${project(':unityLibrary').projectDir}/libs"
        }
    }
}

rootProject.buildDir = file('../build')
subprojects {
    // Drive-aware build directory logic to avoid Windows "different roots" error
    def rootDrive = rootProject.buildDir.absolutePath.split(':')[0]
    def projectDrive = project.projectDir.absolutePath.split(':')[0]
    
    if (rootDrive.equalsIgnoreCase(projectDrive)) {
        project.buildDir = "${rootProject.buildDir}/${project.name}"
    } else {
        // Fallback to default build dir if paths are on different drives (e.g. plugins in C:\ while project is on D:)
        println "INFO: Using default buildDir for ${project.name} to avoid cross-drive issues."
    }

    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileSdkVersion 35
                buildToolsVersion "35.0.0"
                
                // Force Java 21 Toolchain
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_21
                    targetCompatibility JavaVersion.VERSION_21
                }
                
                if (project.android.hasProperty('kotlinOptions')) {
                    project.android.kotlinOptions {
                        jvmTarget = "21"
                    }
                }
                
                if (project.android.namespace == null) {
                    project.android.namespace = "com.halabessa.game.${project.name.replaceAll("-", ".")}"
                }
                
                // ... rest of manifest sanitization ...
                project.android.sourceSets.all { sourceSet ->
                    def manifestFile = sourceSet.manifest.srcFile
                    if (manifestFile != null && manifestFile.exists() && !manifestFile.isDirectory()) {
                        try {
                            def content = manifestFile.text
                            if (content.contains('package=')) {
                                println "Sanitizing manifest for ${project.name} (${sourceSet.name}): ${manifestFile}"
                                manifestFile.text = content.replaceAll(/package="[^"]*"/, '')
                            }
                        } catch (Exception e) {
                            println "Warning: Could not sanitize ${manifestFile}: ${e.message}"
                        }
                    }
                }
            }
        }

        tasks.withType(JavaCompile).configureEach {
            sourceCompatibility = '21'
            targetCompatibility = '21'
        }

        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                jvmTarget = "21"
            }
        }

        if (project.name == 'flutter_unity_widget') {
            // The Unity 6000 plugin declares both project(':unityLibrary') and
            // unity-classes.jar. The Unity module already publishes that JAR,
            // so the second dependency duplicates every com.unity3d.player
            // class in the release runtime classpath. Keep the project
            // dependency and remove only the redundant flatDir dependency.
            project.configurations.implementation.dependencies.removeAll {
                it.name == 'unity-classes'
            }
            // The plugin still compiles directly against UnityPlayer APIs.
            // Make the JAR visible to Kotlin without packaging a second copy.
            project.dependencies {
                compileOnly rootProject.files("../androidBuild/unityExport/unityLibrary/libs/unity-classes.jar")
            }
        }
    }
}

def configureNamespace(project) {
    if (project.android.namespace == null) {
        project.android.namespace = "com.halabessa.game.${project.name.replaceAll(":", "").replaceAll("-", "_")}"
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
