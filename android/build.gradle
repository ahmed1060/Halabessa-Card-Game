allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url "${project(':app').projectDir}/../../unity/Halabessa/Assets/GeneratedLocalRepo/Firebase/m2repository"
        }
        flatDir {
            dirs "${project(':unityLibrary').projectDir}/libs"
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileSdkVersion 35
                buildToolsVersion "35.0.0"
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
                
                if (project.android.namespace == null) {
                    project.android.namespace = "com.halabessa.game.${project.name.replaceAll("-", ".")}"
                }

                // AGP 8+ hack: Strip package attribute from AndroidManifest.xml
                project.android.sourceSets.all { sourceSet ->
                    def manifestFile = sourceSet.manifest.srcFile
                    if (manifestFile != null && manifestFile.exists() && !manifestFile.isDirectory()) {
                        try {
                            def content = manifestFile.text
                            if (content.contains('package=')) {
                                println "Sanitizing manifest for ${project.name} (${sourceSet.name}): ${manifestFile}"
                                manifestFile.text = content.replaceAll(/package="[^"]*"/, '')
                            }
                        } catch (Exception e) {
                            println "Warning: Could not sanitize ${manifestFile}: ${e.message}"
                        }
                    }
                }
            }
        }

        tasks.withType(JavaCompile).configureEach {
            sourceCompatibility = '17'
            targetCompatibility = '17'
        }

        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                jvmTarget = "17"
            }
        }

        if (project.name == 'flutter_unity_widget') {
            project.dependencies {
                implementation rootProject.files("../androidBuild/unityExport/unityLibrary/libs/unity-classes.jar")
            }
        }
    }
}

def configureNamespace(project) {
    if (project.android.namespace == null) {
        project.android.namespace = "com.halabessa.game.${project.name.replaceAll(":", "").replaceAll("-", "_")}"
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
