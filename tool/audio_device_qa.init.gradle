// Explicit local side-by-side audio/gesture review. Never used by shipping/CI.
gradle.beforeProject { project ->
    if (project.path != ':app' || project.rootDir.name != 'android' ||
            !new File(project.rootDir.parentFile, 'pubspec.yaml').isFile()) return
    if (gradle.startParameter.projectProperties['halabessaAudioQa'] != 'true') {
        throw new GradleException('Audio device QA requires -PhalabessaAudioQa=true.')
    }
    project.plugins.withId('com.android.application') {
        project.androidComponents.finalizeDsl { android ->
            android.defaultConfig.applicationId = 'com.halabessa.game.audioqa'
            android.sourceSets.debug.manifest.srcFile(
                new File(project.rootDir.parentFile, 'tool/android_audio_qa/AndroidManifest.xml'))
        }
    }
}
