<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, height=device-height">
  <meta name="theme-color" content="#0D1B2A">
  <meta name="description" content="halabessa - The ultimate Egyptian card game experience.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="halabessa">
  <meta name="apple-touch-fullscreen" content="yes">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Halabessa</title>
  <link rel="manifest" href="manifest.json">

  <!-- Permanent Font Fix: Google Fonts CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Outfit:wght@400;700&family=Righteous&family=Noto+Sans+Arabic:wght@400;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="canvas.css">

</head>

<body>
  <!-- Unity WebGL Engine Loader (Canvas is dynamically injected by Flutter) -->
  <script src="Build/web.loader.js"></script>
  <script>
    var unityInstance = null;

    function createUnityInstanceOnCanvas(canvasElement) {
      if (!canvasElement) return;

      var buildUrl = "Build";
      var cacheBuster = "?v=" + Date.now();

      createUnityInstance(canvasElement, {
        dataUrl: buildUrl + "/web.data.unityweb" + cacheBuster,
        frameworkUrl: buildUrl + "/web.framework.js.unityweb" + cacheBuster,
        codeUrl: buildUrl + "/web.wasm.unityweb" + cacheBuster,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "SHSD",
        productName: "Halabessa",
        productVersion: "1.0",
        premultipliedAlpha: false,
        webglContextAttributes: {
          preserveDrawingBuffer: true,
          alpha: true,
          antialias: true,
          premultipliedAlpha: false,
        },
      }).then((instance) => {
        unityInstance = instance;
        // Release keyboard capture so Flutter input fields function normally
        if (instance.Module && typeof instance.Module.WebGLInput !== 'undefined') {
          instance.Module.WebGLInput.captureAllKeyboardInput = false;
        }
        window.postMessageToUnity = function (message) {
          if (unityInstance !== null) {
            unityInstance.SendMessage("UnityBridge", "OnFlutterMessage", message);
          }
        };
      }).catch((message) => {
        console.error("Unity WebGL build failed to load:", message);
      });
    }

    window.initUnityEngine = function (canvasElement) {
      createUnityInstanceOnCanvas(canvasElement);
    };

    window.handleFlutterMessage = function (message) {
      if (window.postMessageToUnity) {
        window.postMessageToUnity(message);
      }
    };

    window.addEventListener('message', function (event) {
      if (typeof event.data === 'string') {
        try {
          var data = JSON.parse(event.data);
          if (data.objectName && data.methodName && unityInstance) {
            unityInstance.SendMessage(data.objectName, data.methodName, data.message || "");
          }
        } catch (e) { }
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
