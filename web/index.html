<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, height=device-height">
  <meta name="theme-color" content="#3B274C">
  <meta name="description" content="halabessa - The ultimate Egyptian card game experience.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="halabessa">
  <meta name="apple-touch-fullscreen" content="yes">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/halabessa-lantern-apple-touch-v1.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/halabessa-lantern-favicon-32-v1.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/halabessa-lantern-favicon-16-v1.png" />

  <title>Halabessa</title>
  <link rel="manifest" href="manifest.json">

  <!-- Permanent Font Fix: Google Fonts CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Outfit:wght@400;700&family=Righteous&family=Noto+Sans+Arabic:wght@400;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="canvas.css">

</head>

<body>
  <!-- Unity WebGL Engine Loader (Canvas is dynamically injected by Flutter) -->
  <script src="Build/web.loader.js"></script>
  <script>
    var unityInstance = null;
    var unityStartupState = 'idle';
    var unityCanvas = null;

    function failUnityStartup(reason) {
      if (unityStartupState === 'failed') return;
      unityStartupState = 'failed';
      if (unityCanvas) {
        unityCanvas.style.visibility = 'hidden';
        unityCanvas.style.pointerEvents = 'none';
      }
      window.postMessage(JSON.stringify({ event: 'UNITY_FAILED' }), window.location.origin);
      console.error('Unity WebGL unavailable; using Flutter 2D:', reason);
    }

    function createUnityInstanceOnCanvas(canvasElement) {
      if (!canvasElement || unityStartupState !== 'idle') return;
      unityStartupState = 'starting';
      unityCanvas = canvasElement;
      canvasElement.style.visibility = 'hidden';
      canvasElement.addEventListener('webglcontextlost', function () {
        failUnityStartup('webgl_context_lost');
      });

      var buildUrl = "Build";
      var cacheBuster = "?v=" + Date.now();

      Promise.resolve().then(function () { return createUnityInstance(canvasElement, {
        dataUrl: buildUrl + "/web.data.unityweb" + cacheBuster,
        frameworkUrl: buildUrl + "/web.framework.js.unityweb" + cacheBuster,
        codeUrl: buildUrl + "/web.wasm.unityweb" + cacheBuster,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "SHSD",
        productName: "Halabessa",
        productVersion: "1.0",
        premultipliedAlpha: false,
        webglContextAttributes: {
          preserveDrawingBuffer: true,
          alpha: true,
          antialias: true,
          premultipliedAlpha: false,
        },
      }); }).then((instance) => {
        if (unityStartupState === 'failed') return;
        unityInstance = instance;
        unityStartupState = 'running';
        canvasElement.style.visibility = 'visible';
        // Restrict keyboard listening to the canvas element only
        if (instance.Module) {
          instance.Module.keyboardListeningElement = canvasElement;
          if (typeof instance.Module.WebGLInput !== 'undefined') {
            instance.Module.WebGLInput.captureAllKeyboardInput = false;
          }
        }
        canvasElement.removeAttribute("tabindex");

        window.postMessageToUnity = function (message) {
          if (unityInstance !== null) {
            unityInstance.SendMessage("UnityBridge", "OnFlutterMessage", message);
          }
        };
      }).catch((message) => {
        failUnityStartup(message);
      });
    }

    // Global Safeguard: Prevent Unity WebGL from ever hijacking keys when interacting with Flutter UI
    function releaseUnityKeyboard() {
      if (typeof unityInstance !== 'undefined' && unityInstance && unityInstance.Module) {
        if (unityInstance.Module.WebGLInput) {
          unityInstance.Module.WebGLInput.captureAllKeyboardInput = false;
        }
      }
    }
    window.addEventListener('keydown', releaseUnityKeyboard, true);
    window.addEventListener('keyup', releaseUnityKeyboard, true);
    window.addEventListener('keypress', releaseUnityKeyboard, true);
    window.addEventListener('focusin', releaseUnityKeyboard, true);

    window.initUnityEngine = function (canvasElement) {
      createUnityInstanceOnCanvas(canvasElement);
    };

    window.handleFlutterMessage = function (message) {
      if (window.postMessageToUnity) {
        window.postMessageToUnity(message);
      }
    };

    // Unity -> Flutter direction. FlutterUnity.jslib's OnUnityMessageWeb /
    // OnUnitySceneLoadedWeb call these directly; without them every
    // UnityMessageManager.SendMessageToFlutter() throws a TypeError inside
    // the WASM callback (e.g. on every GameStateManager state change and
    // every CardAnimator capture). Forward the raw message string through
    // the same window.postMessage channel Flutter's WebUtils.onMessage
    // listener already reads.
    window.handleUnityMessage = function (message) {
      window.postMessage(message, window.location.origin);
    };

    window.handleUnitySceneLoaded = function (name, buildIndex, isLoaded, isValid) {
      console.log('[Unity] Scene loaded:', name, buildIndex, isLoaded, isValid);
    };

    window.addEventListener('message', function (event) {
      // Flutter and Unity share this window. Reject messages from iframes or
      // another origin, then permit only the bridge methods Flutter uses.
      if (event.origin !== window.location.origin || event.source !== window || typeof event.data !== 'string') return;

      try {
        var data = JSON.parse(event.data);
        var isBridgeMessage = data.objectName === 'UnityBridge' &&
          (data.methodName === 'OnFlutterMessage' || data.methodName === 'ToggleConsole');
        if (isBridgeMessage && unityInstance) {
          unityInstance.SendMessage('UnityBridge', data.methodName, data.message || "");
        }
      } catch (e) { }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
