<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, height=device-height">
  <meta name="theme-color" content="#0D1B2A">
  <meta name="description" content="halabessa - The ultimate Egyptian card game experience.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="halabessa">
  <meta name="apple-touch-fullscreen" content="yes">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>halabessa</title>
  <link rel="manifest" href="manifest.json">

  <!-- Permanent Font Fix: Google Fonts CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Outfit:wght@400;700&family=Righteous&family=Noto+Sans+Arabic:wght@400;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="canvas.css">

</head>

<body>
  <!-- Unity WebGL Canvas (Will be wrapped by Flutter) -->
  <canvas id="unity-canvas"></canvas>

  <!-- Unity WebGL Engine Loader -->
  <script src="Build/unity.loader.js"></script>
  <script>
    var unityInstance = null;

    function createUnityInstanceIfAvailable() {
      var canvas = document.querySelector("#unity-canvas");
      if (!canvas) {
        console.warn("Unity canvas not found yet.");
        return;
      }

      console.log("Creating Unity Instance...");
      createUnityInstance(canvas, {
        dataUrl: "Build/unity.data.unityweb",
        frameworkUrl: "Build/unity.framework.js.unityweb",
        codeUrl: "Build/unity.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Halabessa",
        productVersion: "1.0",
        background: "transparent",
      }).then((instance) => {
        unityInstance = instance;
        console.log("Unity instance successfully created.");

        // Expose Unity interface to Flutter
        window.postMessageToUnity = function (message) {
          if (unityInstance !== null) {
            console.log("Sending to Unity: " + message);
            unityInstance.SendMessage("GameController", "HandleFlutterMessage", message);
          } else {
            console.warn("Unity not ready, message dropped: " + message);
          }
        };
      }).catch((message) => {
        alert("Unity WebGL build failed to load: " + message);
      });
    }

    // Attempt to load Unity right away or wait for DOM
    document.addEventListener("DOMContentLoaded", createUnityInstanceIfAvailable);

    // Fallback global trigger for Flutter to call when mounting UnityGameView wrapper
    window.initUnityEngine = function () {
      createUnityInstanceIfAvailable();
    };

    // Flutter to Unity communication bridge function
    window.handleFlutterMessage = function (message) {
      if (window.postMessageToUnity) {
        window.postMessageToUnity(message);
      } else {
        console.warn("Unity bridge not established yet. Dropping: " + message);
      }
    };
  </script>

  <!-- Default Flutter bootstrap -->
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
